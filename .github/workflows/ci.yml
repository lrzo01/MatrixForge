name: Build

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: matrix-forge-windows
            executable_path: dist/matrix-forge.exe
            is_mac: false
          - os: ubuntu-latest
            artifact_name: matrix-forge-linux
            executable_path: dist/matrix-forge
            is_mac: false
          - os: macos-latest
            artifact_name: matrix-forge-mac
            executable_path: dist/matrix-forge.app
            is_mac: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install project dependencies
        run: |
          uv venv
          uv pip install . pyinstaller

      - name: Build 
        run: uv run pyinstaller --noconsole --name=matrix-forge run.py


      - name: Zip macOS bundle
        if: matrix.os == 'macos-latest' || matrix.is_mac == true
        run: |
          cd dist
          zip -r ../matrix-forge-mac.zip matrix-forge.app
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.is_mac == true && 'matrix-forge-mac.zip' || matrix.executable_path }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Structure release files
        run: |
          mkdir release-dir
          mv artifacts/matrix-forge-windows/* release-dir/ 2>/dev/null || true
          mv artifacts/matrix-forge-linux/* release-dir/ 2>/dev/null || true
          mv artifacts/matrix-forge-mac/* release-dir/ 2>/dev/null || true

      - name: Generate release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dir/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
